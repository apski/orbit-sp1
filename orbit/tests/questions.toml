# Labelled question set for the router (spec 12: accuracy measured, a regression fails the test).
# `expect` is a route id, or "none" when the question must score below threshold (logged as no-match).
# `floor` is the recorded minimum accuracy; raise it when routes improve, never lower it to pass.
