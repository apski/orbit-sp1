# --- signals. glob: repo-relative globs; contains: regex on file text; json_dep: package.json deps.
# root_up = N marks a target root: the directory N levels above the matched file. Every other match is
# grouped under the deepest target root that contains it (a root at "." is transparent: top-level dir).
# adapters / checks / sources / skills: what Orbit needs once this signal is present. -----------------

[[signal]]
id = "xcodeproj"
category = "platform"
domain = "mobile"
glob = ["**/*.xcodeproj/project.pbxproj"]
root_up = 2
adapters = ["swift-full"]
checks = ["xcodebuild-build"]
sources = ["xcode-targets"]
tools = ["xcodebuild", "argent"]
skills = ["axiom-build", "axiom-shipping", "argent-ios-simulator-setup"]

