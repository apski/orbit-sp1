# --- adapters (SPEC 4). Status = Orbit coverage of the adapter's languages inside the signal's roots:
# present >= 90%, partial > 0, missing = 0. ------------------------------------------------------------

[adapters.swift-full]
languages = ["swift"]
build = "Orbit has a Swift regex block; include every Swift file of the target, add unit kinds for its feature dirs, then a SwiftUI ui_usage pass (View conformers, kit symbols)."
[adapters.ts-rn-screens]
languages = ["typescript", "javascript"]
build = "Index the RN app source (src/**); unit kind per screen dir; ui_usage for RN primitives and the app's design-system components."
[adapters.ts-web-screens]
languages = ["typescript", "javascript"]
build = "Index the web app source; unit kind per screen/page dir."
[adapters.ts-server]
languages = ["typescript", "javascript"]
build = "Index the server source; unit kind per service/route dir."
[adapters.python]
languages = ["python"]
build = "Index the Python packages; unit kind per service package."
[adapters.rust]
languages = ["rust"]
build = "New [languages.rust] regex block (use, struct/enum/trait/impl/fn) plus a golden fixture; include the crates; one rust-crate unit per crate (agents get 'unknown unit tax_core' today)."
[adapters.kotlin-android]
languages = ["kotlin", "java"]
build = "New [languages.kotlin] / [languages.java] regex blocks plus a golden fixture."

# --- checks (SPEC 4.4). Present for a root when an Orbit [checks.*] command matches `match` AND names the
# root path. command is the suggested starting point; {root} is the target root. -----------------------

[checks.xcodebuild-build]
match = 'xcodebuild\b.*\bbuild\b'
command = 'xcodebuild build -project {root}/<App>.xcodeproj -scheme <scheme> -destination "generic/platform=iOS Simulator"'
[checks.xcodebuild-test]
match = 'xcodebuild\b.*\btest\b'
command = 'xcodebuild test -project {root}/<App>.xcodeproj -scheme <scheme> -destination "platform=iOS Simulator,name=<device>"'
[checks.swift-test]
match = 'swift\s+test\b'
command = "swift test --package-path {root}"
[checks.tsc]
match = '\btsc\b'
command = "{root}/node_modules/.bin/tsc --noEmit -p {root}"
[checks.jest]
match = '\bjest\b'
command = "yarn --cwd {root} jest --ci"
[checks.gradle-test]
match = 'gradlew?\b.*\btest'
command = "{root}/gradlew -p {root} test"
[checks.py-compile]
match = 'compileall|py_compile'
command = "python3 -m compileall -q {root}"
[checks.pytest]
match = '\bpytest\b'
command = "python3 -m pytest {root}"
[checks.cargo-test]
match = 'cargo\b.*\btest\b'
command = "cargo test --manifest-path {workspace}/Cargo.toml -p {name}"   # {workspace}: outermost Cargo root above the crate
[checks.cypress]
match = '\bcypress\b'
command = "npx --prefix {root} cypress run"

# --- external sources (SPEC 4.3) Orbit should read. Present when orbit.toml has [sources.<id>]. ---------

[sources.xcode-targets]
build = "Read targets, schemes and build settings from *.xcodeproj/project.pbxproj + xcschemes (read-only)."
[sources.rn-navigation]
build = "Read the RN navigator tree (screens, params, stacks) into a route graph."
[sources.design-tokens]
build = "Read token files (tailwind config, tokens.*, colorsets) into kit_patterns / token records."

# --- CLI tools (machine-dependent: checked with PATH lookup). A tool is needed when `always`, when a detected
# signal lists it (`tools = [...]`), or when a skill calls it inside a code span. Any one name in `any` satisfies it.

[tools.ripgrep]
any = ["rg"]
always = true
install = "brew install ripgrep / apt install ripgrep"
[tools.pdf-to-text]
any = ["pdftotext", "markitdown", "pandoc", "mutool"]
always = true
install = "brew install poppler (pdftotext) or pipx install markitdown"
[tools.html-to-text]
any = ["markitdown", "pandoc", "trafilatura", "html2text", "w3m", "lynx"]
always = true
install = "pipx install markitdown (HTML, PDF, DOCX to markdown) or brew install pandoc"
[tools.jq]
any = ["jq"]
install = "brew install jq"
[tools.gh]
any = ["gh"]
install = "brew install gh"
[tools.xcodebuild]
any = ["xcodebuild"]
install = "install Xcode, then xcode-select -s /Applications/Xcode.app"
[tools.argent]
any = ["argent"]
install = "npm i -g @swmansion/argent@latest && argent init -y"
[tools.cargo]
any = ["cargo"]
install = "rustup (https://rustup.rs)"
[tools.node]
any = ["node"]
install = "nvm install --lts"

# --- skills: hints for missing ones (how to get or build them). -------------------------------------

[skills]
argent-react-native-app-workflow = "ships with argent: `argent init -y` / update-argent installs it"
argent-metro-debugger = "ships with argent: `argent init -y` installs it"
argent-react-native-profiler = "ships with argent: `argent init -y` installs it"
argent-android-emulator-setup = "ships with argent: `argent init -y` installs it"
argent-ios-simulator-setup = "ships with argent: `argent init -y` installs it"

# --- routing table: task type -> skills to load. A task is listed when any `when` signal is active (detected
