code = true
[languages.python]
ext = [".py"]
code = true
[languages.rust]
ext = [".rs"]
code = true
[languages.go]
ext = [".go"]
code = true
[languages.ruby]
ext = [".rb"]
code = true
[languages.dart]
ext = [".dart"]
code = true
[languages.c]
