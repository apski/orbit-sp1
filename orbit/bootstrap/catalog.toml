# Orbit bootstrap capability catalog. Data only (SPEC R11): census.py detects signals with it and maps
# each detected signal to the Orbit adapters, check-sets, sources and skills it needs.
# Skill names were seeded from the skills that exist on the first machine (2026-10-17: ~/.claude/skills,
# ~/.codex/skills, .agents/skills). A skill named here but absent from every skill root is reported MISSING.
# Changing this file changes the bootstrap goldens (tests/golden/*): rerun with UPDATE_GOLDEN=1 and say why.

[census]
churn_days = 90                   # default --since = HEAD commit date minus this
max_bytes = 1000000               # files larger than this count as files, not lines
min_lines = 200                   # a language below this many lines gets no "add language" proposal
orbit_configs = [".orbit/orbit.toml", "agents/orbit/orbit.toml", "orbit.toml"]   # first existing wins
skill_roots = [".agents/skills", ".claude/skills", "~/.claude/skills", "~/.codex/skills"]
# Per-repo product decisions (retire paths, churn window, demand buckets); first existing wins. See policy.toml.
policy_files = [".orbit/policy.toml", "agents/orbit/bootstrap/policy.toml"]
# Spec docs that should be linked to units with an orbit [[spec]] entry.
spec_globs = ["**/specs/**/*.md", "**/*.spec.md"]
hotspots = 25
domains = ["mobile", "web", "backend", "tooling"]   # priority when a root carries several
# A target of these kinds with 0 commits in the window is frozen: one retire item, never adapters/checks.
freeze_kinds = ["xcodeproj", "react-native", "android-gradle"]
# Directory names whose children are feature units (Views/Home, screens/Profile, ...).
unit_parents = ["Views", "Screens", "screens", "Features", "features", "Modules", "modules", "Scenes", "pages"]
# Never census these: vendored, generated, caches, scratch copies, test fixtures.
exclude = [
  "**/node_modules/**", "**/.yarn/**", "**/Pods/**", "**/vendor/**", "**/Carthage/**", "**/DerivedData/**",
  "**/build/**", "**/dist/**", "**/.next/**", "**/target/**", "**/__pycache__/**", "**/.venv/**", "**/venv/**",
  "**/.cache/**", "**/*.min.js", "**/*.bundle.js", "**/*.jsbundle",
  "tmp/**", "scratchpad/**", "**/fixture/**", "**/fixtures/**", "**/__fixtures__/**", "**/__snapshots__/**",
]

# Words in a skill's name/description that put a stale-skill item in a domain (first domain that matches wins).
[census.domain_words]
mobile = ["ios", "swift", "swiftui", "uikit", "xcode", "testflight", "app store", "react native", "android", "mobile", "simulator"]
web = ["web", "frontend", "browser", "next.js", "landing"]
backend = ["server", "api", "express", "celery", "tax", "import", "database", "positions", "cross-system", "sync"]
tooling = ["skill", "agent", "deploy", "docker"]

# --- languages. code = true: counts toward the coverage gap (Orbit should parse it). ---------------

[languages.swift]
